defaults:
  seed: 42
  external:
    enzymecage_root: external_repos/EnzymeCAGE
    p2rank_home: data/assets/p2rank/p2rank_2.5.1
    fpocket_bin: fpocket
  data:
    data_mode: demo_mining
    reaction_csv: external_repos/EnzymeCAGE/dataset/demo/reaction.csv
    structure_dir: external_repos/EnzymeCAGE/dataset/demo/structures
    label_csv: null
  model:
    checkpoint_dir: external_repos/EnzymeCAGE/checkpoints/pretrain/seed_42
    checkpoint_name: epoch_19.pth
  evaluation:
    topk: [5, 10]

baselines:
  - name: enzyme405_official_precomputed_pocket
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: official_precomputed
    pocket_selection: top1
    top_k: 1
    aggregation: max
    purpose: official precomputed pocket baseline for Enzyme-405 smallset

  - name: enzyme405_p2rank_topk_max
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: max
    purpose: Enzyme-405 P2Rank top-5 max aggregation

  - name: enzyme405_p2rank_topk_mean
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: mean
    purpose: Enzyme-405 P2Rank top-5 mean aggregation

  - name: enzyme405_p2rank_topk_rank_weighted
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: rank_weighted
    purpose: Enzyme-405 P2Rank top-5 rank-weighted aggregation

  - name: enzyme405_fpocket_top1
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: fpocket
    pocket_selection: top1
    top_k: 1
    aggregation: max
    purpose: Enzyme-405 fpocket top-1 baseline

  - name: enzyme405_fpocket_topk_rank_weighted
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: fpocket
    pocket_selection: topk
    top_k: 5
    aggregation: rank_weighted
    purpose: Enzyme-405 fpocket top-5 rank-weighted aggregation

  - name: enzyme405_p2rank_fpocket_union_max
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank+fpocket
    pocket_selection: union_topk
    top_k_each: 5
    aggregation: max
    purpose: Enzyme-405 P2Rank/fpocket union max

  - name: enzyme405_p2rank_fpocket_union_source_weighted
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank+fpocket
    pocket_selection: union_topk
    top_k_each: 5
    aggregation: source_weighted
    source_weights:
      p2rank: 0.6
      fpocket: 0.4
    purpose: Enzyme-405 P2Rank/fpocket union source-weighted

  - name: orphan335_official_precomputed_pocket
    data_mode: derived_smallset
    source_dataset: Orphan-335
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: official_precomputed
