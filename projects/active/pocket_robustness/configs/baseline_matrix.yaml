  - name: official_eval_enzyme405
    data_mode: official_eval
    config_source: external_repos/EnzymeCAGE/config/infer/Enzyme-405.yaml
    checkpoint_name: epoch_19.pth
    purpose: reproduce official Enzyme-405 inference

  - name: official_eval_orphan335
    data_mode: official_eval
    config_source: external_repos/EnzymeCAGE/config/infer/Orphan-335.yaml
    checkpoint_name: epoch_19.pth
    purpose: reproduce official Orphan-335 inference

  - name: pocket_smallset_from_enzyme405
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: top1
    top_k: 1
    aggregation: max
    purpose: first controllable pocket baseline on real official data

  - name: pocket_smallset_from_enzyme405_p2rank_topk_softmax
    data_mode: derived_smallset
    source_dataset: Enzyme-405
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: softmax_pool
    temperature: 0.2
    purpose: test pocket uncertainty on a small real official slice

  - name: pocket_smallset_from_orphan335_p2rank_top1
    data_mode: derived_smallset
    source_dataset: Orphan-335
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: top1
    top_k: 1
    aggregation: max
