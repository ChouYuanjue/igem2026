    data_mode: derived_smallset
    source_dataset: Orphan-335
    checkpoint_name: epoch_19.pth
    n_reactions: 5
    n_enzymes_per_reaction: 20
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: softmax_pool
    temperature: 0.2
    purpose: pocket uncertainty for orphan reaction retrieval

  - name: official_or_p2rank_top1
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: enzymecage_official_or_p2rank
    pocket_selection: top1
    aggregation: none_or_max
    purpose: reproduce nearest EnzymeCAGE demo inference baseline

  - name: p2rank_top1
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank
    pocket_selection: top1
    top_k: 1
    aggregation: max
    purpose: single predicted pocket baseline

  - name: p2rank_topk_max
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: max
    purpose: optimistic pocket localization uncertainty

  - name: p2rank_topk_mean
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: mean
    purpose: average evidence across pocket hypotheses

  - name: p2rank_topk_rank_weighted
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: rank_weighted
    purpose: trust higher P2Rank pockets more

  - name: p2rank_topk_softmax_pool
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: softmax_pool
    temperature: 0.2
    purpose: learn whether CAGE strongly prefers a non-top1 pocket

  - name: fpocket_top1
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: fpocket
    pocket_selection: top1
    top_k: 1
    aggregation: max
    purpose: compare geometry-based pocket detector with P2Rank

  - name: fpocket_topk_max
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: fpocket
    pocket_selection: topk
    top_k: 5
    aggregation: max
    purpose: geometry-based pocket uncertainty

  - name: fpocket_topk_rank_weighted
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: fpocket
    pocket_selection: topk
    top_k: 5
    aggregation: rank_weighted
    purpose: geometry detector rank prior

  - name: p2rank_fpocket_union_max
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank+fpocket
    pocket_selection: union_topk
    top_k_each: 5
    aggregation: max
    purpose: test whether heterogeneous pocket sources rescue different cases

  - name: p2rank_fpocket_union_source_weighted
    data_mode: demo_mining
    status: unavailable_unless_demo_assets_exist
    pocket_source: p2rank+fpocket
    pocket_selection: union_topk
    top_k_each: 5
    aggregation: source_weighted
    source_weights:
      p2rank: 0.6
      fpocket: 0.4
    purpose: combine ML pocket detector and geometry pocket detector

  - name: p2rank_topk_catalytic_residue_prior
    data_mode: demo_mining
    pocket_source: p2rank
    pocket_selection: topk
    top_k: 5
    aggregation: catalytic_residue_weighted
    purpose: test whether pockets enriched in catalytic residues are better
    status: scaffold_only_initially

  - name: p2rank_topk_scannet_prior
    data_mode: demo_mining
