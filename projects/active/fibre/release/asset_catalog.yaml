schema: fibre-release-asset-catalog-v1
purpose: >-
  Content-addressed ownership/consumption registry. This is not a fourth
  user-facing release package and must not be interpreted as a runtime profile.

groups:
  project_owned_reproduction_weights:
    authority: reproducibility/bime_rank/model_assets.json#project_owned_assets
    storage: bundle_or_content_addressed_store
    consumers: [fibre-reproduction]
    semantics:
      fibre-reproduction: frozen_claim_model_weight

  third_party_reproduction_models:
    authority: reproducibility/bime_rank/model_assets.json#external_model_assets
    storage: pinned_external_restore
    consumers: [fibre-reproduction]
    checksum_required: true

  tps_pair_supervised_source:
    paths:
      - results/terpene_production_models/marts_adapted_drfp_pu
    storage: project_owned
    consumers: [fibre-reproduction, starase-application]
    semantics:
      fibre-reproduction: frozen_historical_model_asset_when_required_by_claim
      starase-application: source_of_tps_adapted_factor_coordinate
    prohibited_uses:
      fibre-method: any
    prohibited_semantics:
      fibre-reproduction:
        - application_coordinate
        - full_data_benchmark
      starase-application:
        - benchmark_evidence

  tps_application_coordinate:
    paths:
      - results/fibre_application/full_data/tps_adapted_coordinate
      - results/fibre_application/full_data/tps_domain_reference
    storage: derived_rebuildable_application_asset
    consumers: [starase-application]
    semantics:
      starase-application: pair_supervised_within_primary_numerical_level_refinement
    prohibited_uses:
      fibre-method: any
      fibre-reproduction: any

  current_fibre_claim_results:
    paths:
      - results/geometric_product_flow_clean_dev_v8
      - results/terpene_product_correspondence_dev_v1
      - results/terpene_product_correspondence_strict_inductive_v1
      - results/fibre_partial_relation_dev_v1
      - results/fibre_partial_relation_strict_inductive_v1
      - results/fibre_broad_zero_temp_dev_v1
    consumers: [fibre-reproduction]
    semantics:
      fibre-reproduction: frozen_claim_or_promotion_audit
    prohibited_uses:
      starase-application: benchmark_evidence_for_full_data_application

  failed_tps_foundation_exploration:
    paths:
      - results/tps_foundation_r2e_v1
    consumers: []
    storage: archive_or_internal_lineage
    release_status: excluded_from_all_three_profiles
    reason: failed_development_gate
