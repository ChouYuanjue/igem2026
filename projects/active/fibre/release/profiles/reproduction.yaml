schema: fibre-release-profile-v1
package_id: fibre-reproduction
display_name: FIBRE Reproduction Bundle
release_role: frozen_claim_reproduction
description: >-
  Frozen BiME/FIBRE interaction-model recipes, splits, candidate universes,
  learned assets and evaluators used for benchmark claims and promotion decisions.
depends_on: [fibre-method]
output_namespace: dist/releases/fibre-reproduction
claim_policy:
  benchmark_metrics: required_and_frozen
  application_performance: forbidden_as_benchmark_evidence
  live_external_evidence: forbidden
  claim_authorities:
    - reproducibility/bime_rank/canonical.json
    - reproducibility/bime_rank/records/BIME_RANK_RETRIEVAL_CAPABILITY_SCORECARD_V2.json
  supplemental_negative_evidence:
    - reproducibility/bime_rank/records/FIBRE_CATALYTIC_INTERACTION_RESIDUAL_DEV_V1.json
  supplemental_audit_authorities:
    - reproducibility/bime_rank/records/BIME_RANK_EXPERT_ADMISSION_V1.json
    - reproducibility/bime_rank/records/BIME_RANK_COST_AWARE_HIERARCHY_V1_RESULT.json
data_policy:
  split_policy: exact_frozen_claim_specific
  test_validation_reuse_for_training: forbidden
  candidate_support: frozen_per_claim
  network_after_asset_restore: disabled
  unknown_pairs_are_negative: false
learning_policy:
  project_owned_weights: must_be_included_or_content_addressed_in_bundle
  external_third_party_weights: pinned_restore_contract_allowed
  pair_supervised_models: allowed_only_when_required_by_the_frozen_claim
  retraining_for_metric_reproduction: recipe_specific
source:
  shared_from: fibre-method
  roots:
    - reproducibility/bime_rank
    - projects/active/fibre/runtime
    - projects/active/fibre/core
    - scripts/maintenance
  required_paths:
    - reproducibility/bime_rank/model_assets.json
    - reproducibility/research_release_manifest.json
    - reproducibility/bime_rank/scripts/evaluate_catalytic_interaction_residual.py
    - projects/active/fibre/tests/test_interaction_kernel.py
    - reproducibility/bime_rank/records/FIBRE_CATALYTIC_INTERACTION_RESIDUAL_DEV_V1.json
  import_scan_roots:
    - reproducibility/bime_rank
    - projects/active/fibre/runtime
    - projects/active/fibre/core
  forbidden_import_prefixes:
    - projects.active.fibre.application
assets:
  project_owned_weight_authority: reproducibility/bime_rank/model_assets.json
  require_every_project_owned_asset_present: true
  third_party_restore_authority: reproducibility/bime_rank/model_assets.json
  application_only_assets: forbidden
  failed_unclaimed_tps_foundation:
    path: results/tps_foundation_r2e_v1
    package_status: excluded
    reason: failed_development_gate_and_not_a_current_claim
isolation:
  may_read_live_application_registry: false
  may_import_application_code: false
  may_enable_tps_application_coordinate: false
  output_must_be_claim_scoped: true
