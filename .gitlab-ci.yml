stages:
  - validate

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install "numpy==1.26.4" "pandas==2.3.3" "scipy==1.17.1" "PyYAML==6.0.3" "pytest==9.1.1" "rdkit==2026.3.2" "POT==0.9.6.post1" "snakemake==9.27.0"
    - python -m pip install -e . --no-deps

igem-software-award:
  stage: validate
  script:
    - test -f README.md
    - test -f LICENSE
    - grep -q "MIT License" LICENSE
    - test -f requirements.lock.txt
    - python -m compileall -q projects/active/fibre scripts
    - PYTHONPATH=. python -m pytest -q projects/active/fibre/tests/test_portable.py projects/active/fibre/tests/test_portable_reaction_center.py
    - rm -rf .test/output
    - PYTHONPATH=. python -m snakemake --snakefile workflow/Snakefile --configfile .test/config.yaml --cores 1 --dry-run
    - PYTHONPATH=. python -m snakemake --snakefile workflow/Snakefile --configfile .test/config.yaml --cores 1
    - PYTHONPATH=. python -m projects.active.fibre.portable.reference_query --bundle .test/output/reference_bundle --reaction-id R0 --top-k 2
    - PYTHONPATH=. python scripts/maintenance/validate_fibre_release_profiles.py --source-only
    - python scripts/maintenance/validate_igem_submission.py
    - python scripts/maintenance/build_igem_submission.py --output /tmp/igem-gitlab
    - test "$(du -sb /tmp/igem-gitlab | cut -f1)" -lt 52428800
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - projects/active/fibre/release/manifests/
