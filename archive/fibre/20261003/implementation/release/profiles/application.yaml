schema: fibre-release-profile-v1
package_id: starase-application
display_name: Starase Application Bundle
release_role: full_information_application
description: >-
  Best-information Starase application bundle on the current accepted database.
  It preserves the deployed intelligent-agent routes while packaging molecular,
  evidence and TPS-family assets that can support the FIBRE interaction atlas.
depends_on: [fibre-method]
output_namespace: dist/releases/starase-application
claim_policy:
  benchmark_metrics: forbidden
  benchmark_result_reuse_as_performance_claim: forbidden
  allowed_claims:
    - application_output
    - candidate_generation
    - provenance_bound_explanation
    - wetlab_planning
data_policy:
  split_policy: none_for_application_build
  use_all_accepted_associations: true
  live_external_evidence: allowed_with_provenance
  missing_optional_coordinate: missing_not_negative
learning_policy:
  pair_supervised_domain_specialization: allowed
  project_trained_weights: allowed
  tps_interaction_chart:
    asset_available: true
    source_model: results/terpene_production_models/marts_adapted_drfp_pu
    method_role: biochemical_family_chart
    candidate_universe_semantics: independent_from_chart_applicability
    broad_universe_atlas_status: pending_frozen_reproduction_admission
    intelligent_agent_route_change_required: false
  tps_adapted_coordinate:
    enabled: true
    builder: projects.active.fibre.application.tps_adapted_coordinate
    source_model: results/terpene_production_models/marts_adapted_drfp_pu
    use_legacy_cross_factor_score: false
    role: legacy_application_representation
source:
  shared_from: fibre-method
  roots:
    - projects/active/fibre/application
    - projects/active/fibre/runtime
    - projects/active/fibre/core
    - projects/active/fibre/evidence
    - projects/active/fibre/pipelines
    - projects/active/fibre/geometry
    - scripts/starase_navigator
  required_paths:
    - projects/active/fibre/application/tps_adapted_coordinate.py
    - scripts/starase_navigator/retrieval/backend_router.py
    - scripts/starase_navigator/routing/reaction_to_enzyme.py
    - scripts/starase_navigator/routing/enzyme_to_reaction.py
    - scripts/starase_navigator
    - configs/production_routes/default.yaml
  import_scan_roots:
    - projects/active/fibre/application
    - projects/active/fibre/runtime
    - projects/active/fibre/core
    - projects/active/fibre/evidence
    - projects/active/fibre/pipelines
    - scripts/starase_navigator
  import_scan_exclude_paths:
    - projects/active/fibre/evidence/biological_witness.py
  package_exclude_paths:
    - projects/active/fibre/evidence/biological_witness.py
  forbidden_import_prefixes:
    - reproducibility
assets:
  allow_current_full_database: true
  allow_structure_pocket_motif_reaction_center: true
  allow_live_evidence_cache: true
  current_information_roots:
    - data/catalyst_candidate_universes/general_merged
    - data/terpene_marts_adaptation
    - data/terpene_marts
    - results/fibre_observation_index_v1
    - results/fibre_uniprot_state_v1
    - results/fibre_publication_context_deepseek_v1
    - results/fibre_rhea_mapping_v1
    - results/fibre_assay_context_v1
    - results/fibre_catalytic_state_v1
    - results/fibre_cross_source_catalytic_evidence_v1
  tps_specialist_source_weights:
    - results/terpene_production_models/marts_adapted_drfp_pu
  generated_application_assets:
    - results/fibre_application/full_data/
isolation:
  may_import_reproduction_code: false
  may_publish_application_metrics_as_benchmark: false
  every_generated_result_requires_release_profile: starase-application
