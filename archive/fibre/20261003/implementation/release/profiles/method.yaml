schema: fibre-release-profile-v1
package_id: fibre-method
display_name: FIBRE Method Kit
release_role: transferable_method
description: >-
  Dataset-agnostic Factorized Interaction Basis for Reaction-Enzyme definition,
  interaction-atlas primitives, local chart gluing, train-free observation updates,
  evidence contracts and universal-coverage invariants. Historical product-manifold geometry is not part of this profile.
depends_on: []
output_namespace: dist/releases/fibre-method
claim_policy:
  benchmark_metrics: forbidden
  application_performance: forbidden
  allowed_claims:
    - method_definition
    - mathematical_contract
    - universal_prediction_contract
    - train_free_positive_update_contract
data_policy:
  accepted_inputs: user_supplied_or_explicitly_snapshotted
  project_database_content: forbidden
  benchmark_split_content: forbidden
  unknown_pairs_are_negative: false
learning_policy:
  pair_supervised_training: allowed_only_on_user_supplied_or_explicitly_frozen_pairs
  project_trained_weights: forbidden
  foundation_encoders: pinned_external_dependency_only
network_policy:
  reference_build: explicit_snapshot_only
  live_enrichment: not_part_of_method_core
source:
  shared_roots:
    - projects/active/fibre/kernel
  test_roots: []
  test_files:
    - projects/active/fibre/tests/test_interaction_kernel.py
    - projects/active/fibre/tests/test_interaction_atlas.py
  required_paths:
    - projects/active/fibre/kernel/interaction.py
    - projects/active/fibre/kernel/atlas.py
    - projects/active/fibre/docs/method.md
    - projects/active/fibre/docs/catalytic_kernel_foundation.md
    - projects/active/fibre/docs/evaluation.md
    - projects/active/fibre/docs/observation_model.md
    - projects/active/fibre/release/rebuild_contract.md
    - README.md
    - LICENSE
    - pyproject.toml
    - requirements.lock.txt
    - CITATION.cff
    - THIRD_PARTY_NOTICES.md
  import_scan_roots:
    - projects/active/fibre/kernel
  forbidden_import_prefixes:
    - projects.active.fibre.application
    - reproducibility
    - scripts.starase_navigator
assets:
  allowed_classes:
    - source_code
    - schema
    - tiny_test_fixture
    - pinned_dependency_contract
  forbidden_path_prefixes:
    - data/
    - results/
    - reproducibility/bime_rank/
    - projects/active/fibre/application/
  project_owned_model_weights: forbidden
isolation:
  can_be_dependency_of: [fibre-reproduction, starase-application]
  may_depend_on_reproduction: false
  may_depend_on_application: false
