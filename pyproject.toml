[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "igem2026-research-workspace"
version = "0.1.0"
description = "Modular iGEM 2026 research workspace for enzyme retrieval and terpene screening experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["projects/active/pocket_robustness/tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = []
