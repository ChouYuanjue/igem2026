[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "igem2026-research-workspace"
version = "0.1.0"
description = "Modular iGEM 2026 research workspace for enzyme retrieval and terpene screening experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "pytest",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.8,<1",
]
runtime = [
  "torch==2.4.0",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-learn==1.9.0",
  "rdkit==2026.3.2",
  # DRFP 0.3.6 is installed separately with --no-deps; see bootstrap script.
  "esm==3.1.1",
]

[tool.pytest.ini_options]
testpaths = [
  "projects/active/terpene_screening/tests",
]
pythonpath = ["."]

[tool.setuptools]
py-modules = []


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
